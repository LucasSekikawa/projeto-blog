{% extends 'blog/base.html' %}

{% block content %}
  <main class="main-content section-wrapper">
    <div class="section-content-wide">
      <div class="section-gap">

        {% if posts %}
        <div class="card-grid">
          {% for post in posts %}
            {% include 'blog/partials/_post-card.html' with i=forloop.counter0 %}
          {% endfor %}
        </div>
        {% else %}
          <div class="not-found center"><h1>Nada encontrado!</h1></div>
          <p>Nada foi encontrado nesse link <a href="{% url "blog:index" %}">Voltar para a home</a></p> 
        {% endif %}

      </div>
    </div>
  </main>
{% endblock content %}
